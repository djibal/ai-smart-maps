site_name: AI-Smart-Maps
theme:
  name: material
nav:
  - Home: index.md
  - Vision:
      - Objectives: vision/objectives.md
      - Constraints: vision/constraints.md
  - Architecture:
      - Logical: architecture/logical.md
      - Trade-offs: architecture/tradeoffs.md
      - Decisions:
          - Index: architecture/decisions/index.md
          - ADR-0001 Docs-First: architecture/decisions/0001-docs-first.md
          - ADR-0002 DTF: architecture/decisions/0002-dtf.md
          - ADR-0003 MTFL-BR: architecture/decisions/0003-mtfl-br.md
          - ADR-0004 ZTMA: architecture/decisions/0004-ztma.md
          - ADR-0005 FARAL: architecture/decisions/0005-faral.md
          - ADR-0006 TDLA: architecture/decisions/0006-tdla.md
          - ADR-0007 CAOM: architecture/decisions/0007-caom.md
          - ADR-0008 Specialized Scorer: architecture/decisions/0008-specialized-on-device-scorer.md
          - ADR-0009 A1 Passed: architecture/decisions/0009-a1-on-device-scorer-pass.md
          - ADR-0010 A2 Passed: architecture/decisions/0010-a2-federated-learning-pass.md
          - ADR-0011 A4 Failed: architecture/decisions/0011-a4-mesh-density-fail.md
          - ADR-0012 A4-v2 Civic Beacons: architecture/decisions/0012-a4-v2-civic-beacons.md
          - ADR-0013 A4-v3 Attenuation: architecture/decisions/0013-a4-v3-attenuation-fail.md
          - ADR-0014 Revise O6: architecture/decisions/0014-revise-o6-latency.md
          - ADR-0015 A3 Community Reports: architecture/decisions/0015-a3-community-reports-pass.md
          - ADR-0016 A6 OSM Freshness: architecture/decisions/0016-a6-osm-freshness-partial-pass.md
  - Risks:
      - Assumptions: risks/assumptions.md
      - Register: risks/register.md
  - Roadmap:
      - Phases: roadmap/phases.md
      - Gates: roadmap/gates.md
  - Knowledge:
      - Usage: knowledge/usage.md
  - Experiments:
      - Index: experiments/index.md
      - A1: experiments/A1-report.md
      - A2: experiments/A2-report.md
      - A3: experiments/A3-report.md
      - A6: experiments/A6-report.md
      - A4: experiments/A4-report.md
      - A4-v2: experiments/A4-v2-report.md
      - A4-v3: experiments/A4-v3-report.md
  - State Ledger: _state/ledger.md
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
