exclude: '^site/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '^mkdocs\.yml$'
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: validate-docs
        name: validate docs
        entry: python scripts/validate_docs.py
        language: system
        pass_filenames: false
      - id: validate-adrs
        name: validate adrs
        entry: python scripts/validate_adrs.py
        language: system
        pass_filenames: false
      - id: check-links
        name: check markdown links
        entry: python scripts/check_links.py
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
